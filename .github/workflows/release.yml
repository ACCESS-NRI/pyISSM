name: Release pyISSM

# Trigger release on push to tags starting with 'v'
on:
  push:
    tags:
      - 'v*'

# Define jobs
jobs:

  # Job 1: Check all CI tests 
  check_ci:
    uses: access-nri/pyISSM/.github/workflows/CI.yml@main
    
  # Job 2: Publish Python package to PyPI and Conda
  publish_python_package:
    needs: check_ci
    uses: access-nri/actions/.github/workflows/publish-python-package.yml@main
    with:
      pypi-package: true
      conda-package: true
    secrets: inherit
    permissions:
      actions: write

  # Job 3: Create GitHub Release
  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish_python_package
    permissions:
      contents: write

    steps:
# Job 3: Create GitHub Release
create-github-release:
  name: Create GitHub Release
  runs-on: ubuntu-latest
  needs: publish_python_package
  permissions:
    contents: write

  steps:
    - name: Download Python artifact
      uses: actions/download-artifact@v8
      with:
        name: ${{ needs.publish_python_package.outputs.python-artifact-name }}
        path: dist

    - name: Download Conda artifact
      uses: actions/download-artifact@v8
      with:
        name: ${{ needs.publish_python_package.outputs.conda-artifact-name }}
        path: dist

    - name: Show release files
      run: find dist -maxdepth 2 -type f -print

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.ref_name }}
        name: pyISSM ${{ github.ref_name }}
        generate_release_notes: true
        fail_on_unmatched_files: true
        files: |
          dist/*# Job 3: Create GitHub Release

name: CI

# Trigger CI on pushes and pull requests to main branch
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:

# Define jobs
jobs:
  
  # Job 1: Check dependencies and installation
  check_dependencies:
    uses: ./.github/workflows/check-dependencies.yml

  # Job 2: Build ISSM
  build_issm:
    uses: ./.github/workflows/build-issm.yml

  # Job 3: Build ISSM AD
  build_issm_ad:
    uses: ./.github/workflows/build-issm-ad.yml

  # Job 4: Run ISSM tests
  issm_tests:
    needs: build_issm
    uses: ./.github/workflows/issm-tests.yml
    with:
      build-type: "issm"
      # 473-476 (HO melt-rate tests) drift ~1e-4 from their archives with ISSM 2026.11.13;
      # excluded until the archives/core are reconciled upstream: https://github.com/ACCESS-NRI/ISSM/issues/46
      test-args: "--range 1:999 --exclude 473,474,475,476"

  # Job 5: Run ISSM AD tests
  issm_ad_tests:
    needs: build_issm_ad
    uses: ./.github/workflows/issm-tests.yml
    with:
      build-type: "issm-AD"
      test-args: "--range 3015:3481" 
  
  # Job 6: Test conda environment and pyISSM installation
  conda_env_test:
    needs: build_issm
    uses: ./.github/workflows/conda-issm-tests.yml
    with:
      build-type: "issm"
      # 473-476 (HO melt-rate tests) drift ~1e-4 from their archives with ISSM 2026.11.13;
      # excluded until the archives/core are reconciled upstream: https://github.com/ACCESS-NRI/ISSM/issues/46
      test-args: "--range 1:999 --exclude 473,474,475,476"

  # Job 7: Run pytest unit tests
  pytest_unit:
    needs: build_issm
    uses: ./.github/workflows/pytest-unit.yml
    with:
      build-type: "issm"
